name: Build & Release DMG

on:
  push:
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish GitHub Release (tag v<VERSION>) and update Homebrew tap"
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Fail-closed docs-only PR filter (adapted from pasrom/meeting-transcriber).
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      code: ${{ steps.filter.outputs.code || 'true' }}
    steps:
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
      - if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        id: filter
        with:
          predicate-quantifier: every
          filters: .github/filters.yml

  build:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: macos-26
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-tags: true

      - name: Cache SwiftPM build
        if: ${{ !(github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) && !(github.event_name == 'workflow_dispatch' && inputs.publish == true) }}
        uses: actions/cache@v6
        with:
          path: .build
          key: ${{ runner.os }}-spm-release-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-release-

      - name: Get version
        id: version
        env:
          PUBLISH_INPUT: ${{ inputs.publish }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$PUBLISH_INPUT" == "true" ]]; then
            VER="$(tr -d '[:space:]' < VERSION)"
            TAG="v${VER}"
            if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
              TAG_COMMIT="$(git rev-list -n 1 "refs/tags/${TAG}")"
              if [[ "$TAG_COMMIT" != "$GITHUB_SHA" ]]; then
                echo "::error::Tag ${TAG} already exists at ${TAG_COMMIT} (current commit is ${GITHUB_SHA}). Bump VERSION before publishing."
                exit 1
              fi
            fi
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
            echo "version=${VER}" >> "$GITHUB_OUTPUT"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build .app and DMG
        run: |
          chmod +x build.sh
          ./build.sh --dmg

      - name: Read DMG SHA256
        id: sha
        run: |
          SHA="$(awk '{print $1}' "dist/BarTune-${{ steps.version.outputs.version }}.dmg.sha256")"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v7
        with:
          name: BarTune-${{ steps.version.outputs.version }}.dmg
          path: |
            dist/BarTune-${{ steps.version.outputs.version }}.dmg
            dist/BarTune-${{ steps.version.outputs.version }}.dmg.sha256

      - name: Create GitHub Release
        if: steps.version.outputs.is_release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: BarTune ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/BarTune-${{ steps.version.outputs.version }}.dmg
            dist/BarTune-${{ steps.version.outputs.version }}.dmg.sha256

      - name: Update Homebrew tap (TrigrD3/homebrew-tap)
        if: steps.version.outputs.is_release == 'true' && env.TAP_TOKEN != ''
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA256: ${{ steps.sha.outputs.sha256 }}
        run: |
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/TrigrD3/homebrew-tap.git" /tmp/homebrew-tap
          mkdir -p /tmp/homebrew-tap/Casks
          cp Casks/bartune.rb /tmp/homebrew-tap/Casks/bartune.rb
          sed -i '' "s/version \".*\"/version \"${VERSION}\"/" /tmp/homebrew-tap/Casks/bartune.rb
          sed -i '' "s/sha256 .*/sha256 \"${SHA256}\"/" /tmp/homebrew-tap/Casks/bartune.rb
          cd /tmp/homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/bartune.rb
          if ! git diff --cached --quiet; then
            git commit -m "chore(cask): update bartune to ${VERSION}"
            git push origin main
          fi

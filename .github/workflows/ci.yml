name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fail-closed docs-only PR filter (adapted from pasrom/meeting-transcriber).
  # Non-PR events fall back to `code = 'true'` so push/dispatch always run.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      code: ${{ steps.filter.outputs.code || 'true' }}
    steps:
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
      - if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        id: filter
        with:
          predicate-quantifier: every
          filters: .github/filters.yml

  lint:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: macos-26
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Install lint tools
        run: brew install swiftlint swiftformat
      - name: SwiftFormat
        run: bash scripts/lint.sh --format-only
      - name: SwiftLint
        run: swiftlint lint --strict --reporter github-actions-logging

  test:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Cache SwiftPM build
        uses: actions/cache@v6
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-
      - name: Build
        run: swift build
      - name: Run unit tests with coverage
        run: swift test --enable-code-coverage
      - name: Export LCOV coverage
        run: |
          BIN_PATH="$(swift build --show-bin-path)"
          TEST_BIN="$(find "$BIN_PATH" -maxdepth 3 -name 'BarTunePackageTests' -type f | head -n 1)"
          PROFDATA="$(swift test --show-codecov-path | sed 's|/codecov/.*|/codecov/default.profdata|')"
          if [[ -n "$TEST_BIN" && -f "$PROFDATA" ]]; then
            xcrun llvm-cov export -format=lcov "$TEST_BIN" -instr-profile="$PROFDATA" > coverage.lcov
          fi
      - name: Upload coverage to Codecov
        if: hashFiles('coverage.lcov') != ''
        uses: codecov/codecov-action@v7
        with:
          files: coverage.lcov
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
      - name: Verify .app bundle build
        run: ./build.sh

# Shared dorny/paths-filter definitions. Referenced by ci.yml and release.yml
# so docs-only PRs skip the macOS build, test, and DMG jobs.
#
# Use with `predicate-quantifier: every` — with v4 default `some`, the `**`
# catch-all alone marks every file as matched and the `!…` negations never
# exclude anything.
code:
  - '**'
  - '!*.md'
  - '!**/*.md'
  - '!docs/**'
  - '!LICENSE'
  - '!.gitignore'

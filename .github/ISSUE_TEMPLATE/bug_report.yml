# Severity option text must keep its leading word (Critical/High/Medium/Low):
# .github/scripts/classify-issue-severity.mjs reads it to apply the severity label.
name: Bug Report
description: Report a bug or playback/lyrics issue in BarTune
title: "[Bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! Give the title a plain description of what goes wrong,
        e.g. `[Bug] Lyrics stay on the previous song after skipping to an instrumental`.

        Not sure it is a bug yet? [Start a discussion](https://github.com/TrigrD3/bartune/discussions) instead.

  - type: input
    id: app-version
    attributes:
      label: BarTune version
      description: From Settings → About, or the `VERSION` file when built from source
      placeholder: "0.3.0"
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: Install method
      options:
        - Homebrew
        - DMG from GitHub Releases
        - Built from source
    validations:
      required: true

  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "15.3 (Apple Silicon)"
    validations:
      required: true

  - type: dropdown
    id: player
    attributes:
      label: Music player
      multiple: true
      options:
        - Spotify
        - Apple Music
        - YouTube Music (browser)
        - YouTube (browser)
        - Spotify Web (browser)
        - SoundCloud (browser)
        - Apple Music Web (browser)
        - Not player-specific
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect to happen, and what actually happened?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Play a track on Spotify
        2. Skip to the next track while a lyric line is showing
        3. ...
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Critical — Crash, data loss, security issue, or app unusable
        - High — Major feature broken with no easy workaround
        - Medium — Noticeable issue with a workaround
        - Low — Minor glitch, cosmetic issue, or edge case
    validations:
      required: true

  - type: textarea
    id: code-location
    attributes:
      label: Code location
      description: If you found this by reading the code, list the file(s) and line(s), e.g. `Sources/BarTune/Models.swift:58`.
    validations:
      required: false

# SwiftLint configuration for BarTune (adapted from pasrom/meeting-transcriber)

included:
  - Sources
  - Tests

excluded:
  - .build
  - BarTune.app

disabled_rules:
  - line_length
  - function_body_length
  - type_body_length
  - file_length
  - cyclomatic_complexity
  - identifier_name
  - trailing_comma
  - multiple_closures_with_trailing_closure
  - nesting
  - force_try
  - large_tuple
  - implicit_optional_initialization
  - redundant_string_enum_value
